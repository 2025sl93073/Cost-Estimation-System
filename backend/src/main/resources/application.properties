spring.application.name=cost-estimation-system

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/cesdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=cesuser
spring.datasource.password=Vishnu@123

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
