spring.application.name=cost-estimation-system

# H2 In-Memory Database (no installation needed)
spring.datasource.url=jdbc:h2:file:./data/cesdb;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (access at http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=ces-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
app.jwt.expiration-ms=86400000

# Server
server.port=8080
server.servlet.context-path=/api
